<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Left or Right</title>
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: #12151e;
      --cyan: #00f2fe;
      --purple: #9d4edd;
      --text: #f8f9fa;
      --subtext: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .glow-bg {
      position: absolute;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.15;
      pointer-events: none;
      z-index: 0;
    }
    .glow-cyan { top: 20%; left: 15%; background: var(--cyan); }
    .glow-purple { bottom: 20%; right: 15%; background: var(--purple); }

    .container {
      position: relative;
      z-index: 1;
      width: 90%;
      max-width: 800px;
      text-align: center;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fff 0%, var(--subtext) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--subtext);
      margin-bottom: 40px;
      font-size: 1.1rem;
    }

    .arena {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    @media (max-width: 600px) {
      .arena { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .btn {
      width: 100%;
      max-width: 200px;
      padding: 18px 24px;
      border: none;
      border-radius: 12px;
      font-size: 1.3rem;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      outline: none;
      transition: all 0.2s ease;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-left {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      box-shadow: 0 0 20px rgba(0, 198, 255, 0.4);
    }

    .btn-right {
      background: linear-gradient(135deg, #7b2cbf, #9d4edd);
      box-shadow: 0 0 20px rgba(157, 78, 221, 0.4);
    }

    .status-msg {
      margin-top: 25px;
      font-size: 0.95rem;
      color: var(--subtext);
      height: 20px;
      transition: opacity 0.3s ease;
    }
  </style>
</head>
<body>

  <div class="glow-bg glow-cyan"></div>
  <div class="glow-bg glow-purple"></div>

  <div class="container">
    <h1>Left or Right?</h1>
    <p class="subtitle">Make your choice. Clicks are recorded directly to the cloud database.</p>

    <div class="arena">
      <div class="card">
        <button class="btn btn-left" id="btn-left">LEFT</button>
      </div>

      <div class="card">
        <button class="btn btn-right" id="btn-right">RIGHT</button>
      </div>
    </div>

    <div class="status-msg" id="status-msg"></div>
  </div>

  <script>
    // Paste your live Render backend URL here
    const API_URL = "https://button-clicker-backend.onrender.com";

    const statusMsg = document.getElementById("status-msg");

    async function sendClick(buttonSide) {
      statusMsg.innerText = `Sending ${buttonSide} vote...`;
      statusMsg.style.opacity = "1";

      try {
        const res = await fetch(`${API_URL}/api/click`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ button: buttonSide })
        });

        if (res.ok) {
          statusMsg.innerText = "Vote recorded!";
        } else {
          statusMsg.innerText = "Failed to record vote.";
        }
      } catch (err) {
        console.error("Error:", err);
        statusMsg.innerText = "Connection error.";
      }

      // Hide message after 2 seconds
      setTimeout(() => {
        statusMsg.style.opacity = "0";
      }, 2000);
    }

    document.getElementById("btn-left").addEventListener("click", () => sendClick("left"));
    document.getElementById("btn-right").addEventListener("click", () => sendClick("right"));
  </script>
</body>
</html>
